name: Release

# Une seule chaine de publication : pousser un tag vX.Y.Z.
#
# Le workflow construit le paquet, calcule le SHA-256 DE CE FICHIER PRECIS,
# publie la release, puis ecrit ce hash dans update/jmm_update.xml sur master.
# Le hash et l'archive telechargee par Joomla viennent donc toujours du meme
# fichier. Ne publiez pas la release a la main : une archive reconstruite
# ailleurs aurait un autre hash et Joomla refuserait la mise a jour.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifier que le tag est sur master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Le tag $GITHUB_REF_NAME ne pointe pas sur un commit de master."
            exit 1
          fi

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Syntaxe PHP et tests
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null
          php tests/run.php

      - name: Construire le paquet, calculer le SHA-256, generer la mise a jour
        run: |
          python3 tools/build-package.py \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --out dist \
            --update-xml-out dist/jmm_update.xml

      - name: Verifier le paquet
        run: |
          cd dist
          sha256sum -c ./*.zip.sha256
          unzip -l ./*.zip | grep -qE ' jmm\.xml$'
          unzip -l ./*.zip | grep -qE ' script\.php$'
          if unzip -l ./*.zip | grep -qE 'Deploy-Jmm|\.github/|\.vscode/|tools/|tests/'; then
            echo "::error::Des fichiers de developpement se sont glisses dans le paquet."
            exit 1
          fi
          grep -q "<sha256>$(cut -d' ' -f1 ./*.zip.sha256)</sha256>" jmm_update.xml

      - name: Creer ou mettre a jour la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/com_jmm-*.zip dist/com_jmm-*.zip.sha256 --clobber
            gh release edit "$TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" dist/com_jmm-*.zip dist/com_jmm-*.zip.sha256 \
              --title "JMM ${VERSION}" \
              --notes-file dist/release-notes.md
          fi

      - name: Publier jmm_update.xml sur master
        run: |
          TAG="$GITHUB_REF_NAME"
          SHA="$(cut -d' ' -f1 dist/com_jmm-*.zip.sha256)"
          cp dist/jmm_update.xml "$RUNNER_TEMP/jmm_update.xml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master
          cp "$RUNNER_TEMP/jmm_update.xml" update/jmm_update.xml
          git add update/jmm_update.xml
          if git diff --cached --quiet; then
            echo "jmm_update.xml est deja a jour."
          else
            git commit -m "Serveur de mises a jour : ${TAG} (sha256 ${SHA})"
            git push origin master
          fi
