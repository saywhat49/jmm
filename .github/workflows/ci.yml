name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Syntaxe PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests
        run: php tests/run.php

      - name: Manifestes XML
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils > /dev/null
          find . -name '*.xml' -not -path './.git/*' -print0 | xargs -0 -n1 xmllint --noout

      - name: Fichiers de langue
        run: |
          php -r '
          $bad = 0;
          foreach (glob("{administrator,site}/language/*/*.ini", GLOB_BRACE) as $f) {
              if (@parse_ini_file($f, false, INI_SCANNER_RAW) === false) { fwrite(STDERR, "ini invalide : $f\n"); $bad++; }
          }
          foreach (["administrator", "site"] as $d) {
              foreach (["com_jmm.ini", "com_jmm.sys.ini"] as $n) {
                  $en = "$d/language/en-GB/$n"; $fr = "$d/language/fr-FR/$n";
                  if (!is_file($en) || !is_file($fr)) { continue; }
                  $a = array_keys(parse_ini_file($en, false, INI_SCANNER_RAW));
                  $b = array_keys(parse_ini_file($fr, false, INI_SCANNER_RAW));
                  foreach (array_diff($a, $b) as $k) { fwrite(STDERR, "absente en fr-FR ($d/$n) : $k\n"); $bad++; }
                  foreach (array_diff($b, $a) as $k) { fwrite(STDERR, "absente en en-GB ($d/$n) : $k\n"); $bad++; }
              }
          }
          exit($bad ? 1 : 0);'

      - name: Construction du paquet (essai a blanc)
        run: python3 tools/build-package.py --out "$RUNNER_TEMP/dist" --update-xml-out "$RUNNER_TEMP/dist/jmm_update.xml"
